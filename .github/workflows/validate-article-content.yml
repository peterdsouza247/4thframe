name: Validate article content

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish BioWare editorial batch
        if: github.event_name == 'push' && github.ref_name == 'editorial/bioware-dragon-age-legacy-2026'
        run: |
          python3 scripts/add_article.py content/drafts/why-dragon-age-original-trilogy-mattered.md --dry-run
          python3 scripts/add_article.py content/drafts/why-dragon-age-original-trilogy-mattered.md
          python3 scripts/add_article.py content/drafts/best-bioware-games-ranked.md
          python3 scripts/add_article.py content/drafts/mass-effect-universe-what-could-have-been.md
          python3 scripts/add_article.py content/drafts/games-to-play-instead-of-mass-effect-5.md
          python3 scripts/add_article.py content/drafts/best-browser-easter-eggs-hidden-games.md
      - name: Publish 2026 GOTY ranking on temporary editorial branch
        if: github.event_name == 'push' && github.ref_name == 'editorial/goty-2026-and-historical-ballot'
        run: |
          if [ ! -f stories/best-games-2026-ranked/index.html ]; then
            python3 scripts/add_article.py content/drafts/best-games-2026-ranked.md --dry-run
            python3 scripts/add_article.py content/drafts/best-games-2026-ranked.md
          fi
      - name: Rebuild article metadata, search, and guides
        run: python3 scripts/build_content.py
      - name: Run article rendering tests
        run: python3 scripts/test_article_rendering.py
      - name: Check review registry and discovery
        run: python3 scripts/test_reviews.py
      - name: Run article exchange regression tests
        run: python3 scripts/test_article_exchange.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit regenerated tracked files to editorial branch
        if: github.event_name == 'push' && (github.ref_name == 'editorial/christy-marx-india-games-2026' || github.ref_name == 'editorial/bioware-dragon-age-legacy-2026' || github.ref_name == 'editorial/steam-reviews-voice-guide-2026' || github.ref_name == 'editorial/goty-2026-and-historical-ballot')
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Fourth Frame article discovery files"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
