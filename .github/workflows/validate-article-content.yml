name: Validate article content

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish BioWare editorial batch
        if: github.event_name == 'push' && github.ref_name == 'editorial/bioware-dragon-age-legacy-2026'
        run: |
          python3 scripts/add_article.py content/drafts/why-dragon-age-original-trilogy-mattered.md --dry-run
          python3 scripts/add_article.py content/drafts/why-dragon-age-original-trilogy-mattered.md
          python3 scripts/add_article.py content/drafts/best-bioware-games-ranked.md
          python3 scripts/add_article.py content/drafts/mass-effect-universe-what-could-have-been.md
          python3 scripts/add_article.py content/drafts/games-to-play-instead-of-mass-effect-5.md
          python3 scripts/add_article.py content/drafts/best-browser-easter-eggs-hidden-games.md
      - name: Publish TV and anime batch using native script
        if: github.event_name == 'push' && github.ref_name == 'editorial/jojo-samurai-x-classic-animation-2026' && github.actor != 'github-actions[bot]'
        run: |
          python3 scripts/add_article.py content/drafts/jojo-bizarre-adventure-watch-guide-spoiler-recaps.md --dry-run
          python3 scripts/add_article.py content/drafts/jojo-bizarre-adventure-watch-guide-spoiler-recaps.md
          python3 scripts/add_article.py content/drafts/samurai-x-rurouni-kenshin-1996-retrospective.md
          python3 scripts/add_article.py content/drafts/saber-rider-star-sheriffs-retrospective.md
          python3 scripts/add_article.py content/drafts/conan-the-adventurer-cartoon-retrospective.md
          python3 scripts/add_article.py content/drafts/double-dragon-1993-cartoon-retrospective.md
      - name: Rebuild article metadata, search, and guides
        run: python3 scripts/build_content.py
      - name: Run article rendering tests
        run: python3 scripts/test_article_rendering.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit regenerated tracked files to editorial branch
        if: github.event_name == 'push' && (github.ref_name == 'editorial/christy-marx-india-games-2026' || github.ref_name == 'editorial/bioware-dragon-age-legacy-2026' || (github.ref_name == 'editorial/jojo-samurai-x-classic-animation-2026' && github.actor != 'github-actions[bot]'))
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish BioWare articles and regenerate site discovery files"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
